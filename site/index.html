<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Il tuo editor di scrittura con suggerimenti intelligenti in tempo reale." />
    <title>Scrivia AI — Spazio alle tue idee</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <script>
      // Applies the saved theme before first paint to avoid a light flash.
      (function(){try{var t=localStorage.getItem('scrivia:theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;}catch(e){}})();
    </script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
